services:
  nginx:
    # Fester Name als Ziel für den Reverse Proxy (Stack «proxy» auf dem Pi)
    container_name: dify-nginx
    networks:
      default:
      proxy:
    # Keine Ports nach aussen, Zugriff nur über das Netzwerk «proxy»
    ports: !override []
  plugin_daemon:
    ports: !override []

networks:
  proxy:
    external: true
